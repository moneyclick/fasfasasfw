name: Build Sa1zy TikTok Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos & Dependencies
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -LO https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks/
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Compile Tweak
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1

      - name: Extract dylib
        run: |
          mkdir -p output
          cp .theos/obj/debug/Sa1zyTikTokMod.dylib output/Sa1zyTikTokMod.dylib 2>/dev/null || cp .theos/obj/Sa1zyTikTokMod.dylib output/Sa1zyTikTokMod.dylib || find .theos -name "*.dylib" -exec cp {} output/ \;

      - name: Upload dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sa1zyTikTokMod-dylib
          path: output/Sa1zyTikTokMod.dylib
