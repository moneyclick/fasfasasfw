name: Build Sa1zy TikTok Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize line endings
        run: |
          find . -type f -not -path '*/.*' -exec tr -d '\r' < {} > {}.tmp \; -exec mv {}.tmp {} \; 2>/dev/null || true

      - name: Install Theos & Dependencies
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -LO https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks/
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Compile Tweak
        run: |
          export THEOS=$HOME/theos
          make all FINALPACKAGE=1
          make package FINALPACKAGE=1 || true

      - name: Gather Build Artifacts
        run: |
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \; 2>/dev/null || true
          find packages -name "*.deb" -exec cp {} output/ \; 2>/dev/null || true
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sa1zyTikTokMod-Built
          path: output/*
